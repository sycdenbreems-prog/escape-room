function mkFut(R){const N=5,n=25,sol=latSol(R,N),all=[];

const sec=Math.ceil(t/1000);if(t>0&&!S.over&&sec!=S.ls){S.ls=sec;tk(sec%2)}
if(!t&&!S.over){S.over=1;S.fin='time';save();clearInterval(S.iv);alarm();showFin()}}

function tabs(){put(S.tabsEl,S.mine.map(i=>E('button',{class:'tab'+(S.cur==i?' on':''),on:{click:()=>openP(i)}},`${i+1} ${TY[S.pz[i]]}`+(S.ok[i]?' ✓':''))))}
function openP(i){S.cur=i;save();tabs();const pv=S.pv;put(pv,'Puzzel wordt gemaakt…');setTimeout(()=>{if(S.pv===pv)buildP(i)},30)}
function buildP(i){const t=S.pz[i],R=rng(S.seed*131+i*7919+1),p=S.cache[i]||(S.cache[i]=[mkSudoku,mkTect,mkLog,mkBin,mkNon,mkKil,mkSky,mkFut][t](R)),pv=S.pv,lock=!!S.ok[i];
if(S.sv){const q=S.sv;if(q.vals&&q.vals[i]&&!p.vals)p.vals=q.vals[i];if(q.sel&&q.sel[i]&&!p.sel)p.sel=q.sel[i]}
const done=m=>{S.ok[i]=1;save();put(m,somCard(i,t,p));tabs()},wrap=(rule,f)=>{const gr=E('div');put(pv,E('p',null,rule),gr);f(gr)};
if(t==0){p.vals=p.vals||p.g.slice();gridUI(pv,{cols:9,vals:p.vals,fx:p.g,sol:p.sol,max:9,w:40,done,locked:lock,bd:(r,c)=>[r%3==0,c%3==2,r%3==2,c%3==0]})}
else if(t==1){p.vals=p.vals||p.g.slice();const g=p.reg;gridUI(pv,{cols:7,vals:p.vals,fx:p.g,sol:p.sol,max:5,w:44,done,locked:lock,
bd:(r,c)=>{const q=r*7+c;return[r==0||g[q-7]!=g[q],c==6||g[q+1]!=g[q],r==6||g[q+7]!=g[q],c==0||g[q-1]!=g[q]]}})}
else if(t==2){const lt=E('div');put(pv,E('ol',null,p.clues.map(c=>E('li',null,c))),lt);logTable(lt,p,{done,locked:lock})}
else if(t==3){p.vals=p.vals||p.g.slice();wrap('Binairo: vul 0 en 1 in. In elke rij en kolom staan evenveel nullen als enen (drie van elk). Er staan nooit meer dan twee gelijke cijfers direct naast of onder elkaar.',gr=>gridUI(gr,{cols:6,vals:p.vals,fx:p.g,sol:p.sol,max:2,w:46,done,locked:lock,sh:x=>x-1,bd:(r,c)=>[r==0,c==5,r==5,c==0]}))}
else if(t==4){p.vals=p.vals||Array(36).fill(0);wrap('Nonogram: kleur vakjes in. De getallen bij een rij of kolom geven de lengtes van de aaneengesloten blokken ingekleurde vakjes, in volgorde, met minstens één leeg vakje ertussen. Tik op een vakje om te kleuren of te wissen.',gr=>nonUI(gr,{vals:p.vals,rc:p.rc,cc:p.cc,done,locked:lock}))}
else if(t==5){p.vals=p.vals||p.g.slice();const g=p.reg;wrap('Killer: zet in elk vakje een cijfer van 1 t/m 5, zodat elk cijfer in elke rij en elke kolom precies één keer staat. Het getal in de hoek van een omrand gebied is de som van de cijfers in dat gebied.',gr=>gridUI(gr,{cols:5,vals:p.vals,fx:p.g,sol:p.sol,max:5,w:56,done,locked:lock,tag:x=>p.tag[x],
bd:(r,c)=>{const q=r*5+c;return[r==0||g[q-5]!=g[q],c==4||g[q+1]!=g[q],r==4||g[q+5]!=g[q],c==0||g[q-1]!=g[q]]}}))}
else if(t==6){p.vals=p.vals||p.g.slice();wrap('Wolkenkrabbers: zet in elk vakje een gebouw van hoogte 1 t/m 5, zodat elke hoogte in elke rij en kolom één keer voorkomt. Het getal buiten het rooster zegt hoeveel gebouwen je vanaf die kant ziet. Hoge gebouwen verbergen lagere erachter.',gr=>gridUI(gr,{cols:7,vals:p.vals,fx:p.fx,sol:p.si,max:5,w:46,done,locked:lock,
bd:(r,c)=>[r==1&&c>0&&c<6,c==5&&r>0&&r<6,r==5&&c>0&&c<6,c==1&&r>0&&r<6]}))}
else{p.vals=p.vals||p.g.slice();wrap('Futoshiki: zet in elk vakje een cijfer van 1 t/m 5, zodat elk cijfer in elke rij en kolom één keer voorkomt. Het teken tussen twee vakjes wijst naar het kleinere getal: < en > naast elkaar, ∧ en ∨ boven elkaar.',gr=>gridUI(gr,{cols:9,vals:p.vals,fx:p.fx,sol:p.sol,max:5,w:38,done,locked:lock,bd:()=>[0,0,0,0]}))}}
function row(i){const el=S.rowEls[i];let c;
if(S.ok[i])c=E('div',null,'Antwoord ',E('input',{class:'ci',value:String(S.val[i]),readOnly:true}),' vastgelegd');
else{const inp=E('input',{class:'ci',maxLength:4,inputMode:'numeric'});
c=E('div',null,'Antwoord van de speler ',inp,E('button',{on:{click:()=>{if(!/^\d+$/.test(inp.value))return;S.val[i]=inp.value;S.ok[i]=1;save();row(i);if(S.pz.every((_,k)=>S.ok[k]))showCalc()}}},'Bevestig'))}
put(el,E('b',null,`Puzzel ${i+1} – ${TY[S.pz[i]]}`),c)}
function showAns(){if(S.ph)return;S.ph=1;save();put(S.ansEl,E('h3',null,'Antwoorden van de spelers'),E('p',{class:'mu'},'Elke speler geeft nu het antwoord van de som van zijn puzzels door. Voer ze hier in. Je krijgt geen melding of een antwoord klopt. Een bevestigd antwoord staat vast. Pas als alle antwoorden zijn ingevoerd verschijnt de laatste som.'),E('div',null,S.rowEls));if(S.pz.every((_,k)=>S.ok[k]))showCalc()}
function showCalc(){if(S.ph2)return;S.ph2=1;const b=S.big,fc=E('input',{maxLength:8,inputMode:'numeric'}),fe=E('div',{class:'err'});if(S.left==null)S.left=3;
put(S.calcEl,E('h3',null,'Laatste som – kluiscode'),E('div',{class:'card'},E('p',null,'Reken de regels hieronder van boven naar beneden uit. Doe één regel tegelijk en schrijf de uitkomst op. Elke regel gebruikt de letter van de regel erboven.'),
E('ul',null,E('li',null,E('b',null,'P1, P2, ...'),' zijn de antwoorden van de spelers (zie het lijstje hieronder).'),E('li',null,E('b',null,'plek van X'),' is het nummer (1 t/m 5) van de plek waar X in jullie opgeloste hoofdpuzzel staat.'),E('li',null,E('b',null,'aantal letters van X'),' is het aantal letters van dat woord, bijvoorbeeld Hond = 4.')),
E('table',null,S.pz.map((_,i)=>E('tr',null,E('td',null,`P${i+1}`),E('td',null,S.val[i]))))),
E('div',{class:'card'},E('table',null,b.steps.map(x=>E('tr',null,E('td',null,x))))),
E('label',null,'Cijferslot (de uitkomst van de laatste regel)',fc),E('p',{class:'mu'},'Je hebt 3 kansen.'),
E('button',{class:'pri',on:{click:()=>{if(S.over||!fc.value)return;if(fc.value==b.fin){S.over=1;clearInterval(S.iv);fc.readOnly=true;const t=Math.max(0,S.end-Date.now());S.tl=(t/60000|0)+':'+String(t/1000%60|0).padStart(2,'0');S.fin='escaped';save();showFin()}
else{S.left--;fc.value='';if(S.left<=0){S.over=1;clearInterval(S.iv);fc.readOnly=true;S.fin='locked';save();showFin()}else{save();fe.textContent=`Onjuiste code. Je hebt nog ${S.left} kans${S.left>1?'en':''}.`}}}}},'Bevestig'),fe);
if(S.left<3&&S.left>0)fe.textContent=`Je hebt nog ${S.left} kans${S.left>1?'en':''}.`}
function host(){S.tmEl=E('b');S.rowEls=S.pz.map(()=>E('div',{class:'card'}));S.ansEl=E('div');S.calcEl=E('div');const big=E('div',{class:'mu'},'Bezig met genereren…');
put(app,E('div',{class:'bar'},E('span',null,'Hoofdpuzzel'),E('span',null,E('button',{on:{click:e=>{MUTE=!MUTE;e.target.textContent=MUTE?'Geluid aan':'Geluid uit'}}},'Geluid uit'),'Resterende tijd ',S.tmEl)),
E('h3',null,'Hoofdpuzzel – groot logigram'),big,S.ansEl,S.calcEl,abortBtn());S.pz.forEach((_,i)=>row(i));
const sv=S;setTimeout(()=>{if(S!==sv)return;const b=mkBig(rng(S.seed*131+99991),S.pz.length),bt=E('div');S.big=b;if(S.sv&&S.sv.bigSel)b.sel=S.sv.bigSel;big.className='';
put(big,E('div',{class:'card'},'Vier categorieën (plek, naam, beroep en kleur) met elk vijf items. Plek 1 staat links en plek 5 rechts. Elk item hoort bij precies één plek. Zoek bij elke plek het juiste item. Reken op ongeveer 10 minuten. Rond de puzzel pas af als je zeker bent: daarna volgen de antwoorden van de spelers en de laatste som.'),E('ol',null,b.clues.map(c=>E('li',null,c))),bt);
logTable(bt,b,{locked:!!(S.sv&&S.sv.ph),done:m=>{put(m,'Hoofdpuzzel afgerond.');showAns()}})},40)}
(function(){let d=null;try{d=loadSave()}catch(e){}if(d)resume(d);else{let seen=false;try{seen=!!localStorage.getItem(KS)}catch(e){}seen?home():uitleg()}})();
